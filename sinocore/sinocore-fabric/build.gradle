unifiedPublishing {
    project {
        displayName = "${parent.mod_name} Fabric ${project.parent.mod_version} for MC ${libs.versions.minecraft.get()}"
        version = project.version
        gameVersions = [libs.versions.minecraft.get()]
        gameLoaders = ['fabric']
        releaseType = 'release'

        mainPublication tasks.remapJar

        relations {
            depends {
                curseforge = 'fabric-api'
                modrinth = 'fabric-api'
            }
        }

        curseforge {
            token = Objects.requireNonNullElse(System.getenv('CURSEFORGE_TOKEN'), "")
            id = parent.curseforge_project_id
        }

        modrinth {
            token = Objects.requireNonNullElse(System.getenv('MODRINTH_TOKEN'), "")
            id = parent.modrinth_project_id
        }
    }
}
